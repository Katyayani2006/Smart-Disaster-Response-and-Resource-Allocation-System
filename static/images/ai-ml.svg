<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Grid Accent Lines -->
  <path d="M50 100 H550 M50 200 H550 M50 300 H550" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M150 50 V350 M300 50 V350 M450 50 V350" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Connecting AI Neural Mesh -->
  <g stroke="#3b82f6" stroke-width="2" opacity="0.6">
    <line x1="150" y1="120" x2="300" y2="90"/>
    <line x1="150" y1="120" x2="300" y2="200"/>
    <line x1="150" y1="280" x2="300" y2="200"/>
    <line x1="150" y1="280" x2="300" y2="310"/>
    <line x1="300" y1="90" x2="450" y2="150"/>
    <line x1="300" y1="200" x2="450" y2="150"/>
    <line x1="300" y1="200" x2="450" y2="270"/>
    <line x1="300" y1="310" x2="450" y2="270"/>
  </g>

  <!-- Pulse Rings -->
  <circle cx="300" cy="200" r="45" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.4"/>
  <circle cx="300" cy="200" r="60" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Neural Nodes -->
  <circle cx="150" cy="120" r="10" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="150" cy="280" r="10" fill="#60a5fa" filter="url(#glow)"/>
  
  <circle cx="300" cy="90" r="12" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="300" cy="200" r="18" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="300" cy="310" r="12" fill="#3b82f6" filter="url(#glow)"/>

  <circle cx="450" cy="150" r="10" fill="#10b981" filter="url(#glow)"/>
  <circle cx="450" cy="270" r="10" fill="#10b981" filter="url(#glow)"/>

  <!-- Central AI Pulse Icon -->
  <path d="M292 192 L308 192 L308 208 L292 208 Z" fill="#ffffff"/>
  
  <!-- Text Label -->
  <text x="300" y="365" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="2">INTELLIGENT DISASTER ALLOCATION ENGINE</text>
</svg>
